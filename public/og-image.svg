<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Circles -->
  <circle cx="1050" cy="120" r="300" fill="#1E4592" fill-opacity="0.05" />
  <circle cx="150" cy="520" r="240" fill="#F15A24" fill-opacity="0.05" />

  <!-- Central Card -->
  <rect x="150" y="80" width="900" height="470" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Logo Mark centered in top section -->
  <g transform="translate(520, 115) scale(1.4)">
    <!-- Pixels -->
    <rect x="18" y="16" width="9" height="9" rx="1.5" fill="#1E4592" />
    <rect x="31" y="16" width="9" height="9" rx="1.5" fill="#F15A24" />

    <!-- Orange Stem -->
    <rect x="31" y="29" width="15" height="52" rx="2" fill="#F15A24" />

    <!-- Blue "R" Loop -->
    <path
      d="M 48 29 H 68 C 84 29 97 38 97 53 C 97 67 85 76 68 76 H 48 V 61 H 66 C 74 61 80 57 80 52.5 C 80 47.5 74 44 66 44 H 48 V 29 Z"
      fill="#1E4592"
    />

    <!-- Orange Wave -->
    <path
      d="M 16 67 C 28 60 42 56 58 56 C 68 56 78 60 84 57 C 81 64 72 71 58 71 C 42 71 28 77 15 80 C 14 76 14 71 16 67 Z"
      fill="#F15A24"
    />

    <!-- Blue Lower Wave -->
    <path
      d="M 14 79 C 28 70 46 69 61 74 C 71 78 79 86 85 96 L 98 116 H 79 L 71 99 C 66 89 57 85 47 85 C 34 85 24 90 12 94 C 11 89 12 84 14 79 Z"
      fill="#1E4592"
    />
  </g>

  <!-- Typography -->
  <text x="600" y="325" text-anchor="middle" fill="#1E4592" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3">
    DIGITAL INFORMATION RESOURCES
  </text>
  <text x="600" y="370" text-anchor="middle" fill="#F15A24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" letter-spacing="4">
    Company Limited
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="440" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="19">
    International Curricula · U Book Store · Win Digital Learning Hub
  </text>
  <text x="600" y="475" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16">
    Yangon, Myanmar · Member of Myint Thuka Nadi Group (Est. 2005)
  </text>
</svg>
